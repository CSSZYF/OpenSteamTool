name: Diagnostic Build (DLC offline probe)

# Builds ONLY the Debug DLLs (with the temporary DIAG logging) on GitHub's
# MSVC runners and uploads them as an artifact. No tag, no release — meant for
# quick diagnostic iteration. Triggers on push to the diag branch or manually.
on:
  workflow_dispatch: {}
  push:
    branches:
      - diag-dlc-offline

jobs:
  build-debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S src -B build -G "Ninja Multi-Config" -DOPENSTEAMTOOL_VERSION="diag-${{ github.sha }}"

      - name: Build Debug (OpenSteamTool.dll / dwmapi.dll / xinput1_4.dll)
        run: cmake --build build --config Debug

      - name: Check DLL loads and unloads in a non-Steam host
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class HostGuardCheck {
            [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
            public static extern IntPtr LoadLibraryW(string path);
            [DllImport("kernel32.dll", SetLastError = true)]
            public static extern bool FreeLibrary(IntPtr module);
            [DllImport("kernel32.dll", CharSet = CharSet.Unicode)]
            public static extern IntPtr GetModuleHandleW(string name);
          }
          '@
          $dllPath = (Resolve-Path 'build/Debug/OpenSteamTool.dll').Path
          $module = [HostGuardCheck]::LoadLibraryW($dllPath)
          if ($module -eq [IntPtr]::Zero) { throw "Load failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          Start-Sleep -Seconds 1
          if (Test-Path 'build/Debug/opensteamtool') { throw 'Unexpected initialization outside steam.exe' }
          if (-not [HostGuardCheck]::FreeLibrary($module)) { throw 'Unload failed' }
          if ([HostGuardCheck]::GetModuleHandleW($dllPath) -ne [IntPtr]::Zero) { throw 'DLL was pinned outside steam.exe' }
          Write-Output 'Non-Steam host loaded and unloaded without starting the runtime.'

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSteamTool-Debug
          path: build/Debug/
          if-no-files-found: error
