name: Build Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example v1.4.8.14-dave.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Validate version and release notes
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -cnotmatch '^v[0-9][0-9A-Za-z._-]{0,59}$') { throw 'Invalid release version' }
          if (-not (Test-Path "docs/releases/$env:RELEASE_VERSION.md")) { throw 'Release notes are required' }

      - name: Configure Release version
        shell: pwsh
        run: cmake -S src -B build -G "Ninja Multi-Config" "-DOPENSTEAMTOOL_VERSION=$env:RELEASE_VERSION"

      - name: Build Release only
        run: cmake --build build --config Release

      - name: Build companion and test native launch sequence
        shell: pwsh
        run: |
          ./tools/DaveLauncher/build.ps1 -Test -OutputDirectory build/Release/dave-launcher
          cl /nologo /std:c++20 /EHsc /utf-8 /MT /DNOMINMAX /DOST_STEAMPLAY_REDIRECT_TEST /Isrc /Isrc/OSTPlatform /Ibuild/generated src/Utils/OfflineLaunch/SteamPlayRedirectTests.cpp src/OSTPlatform/Encoding.cpp /Fe:build/SteamPlayRedirectTests.exe shell32.lib crypt32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Native test build failed' }
          ./build/SteamPlayRedirectTests.exe "$PWD/build"
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }

      - name: Verify Release binary and host guard
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class ReleaseHostCheck {
            [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
            public static extern IntPtr LoadLibraryW(string path);
            [DllImport("kernel32.dll", SetLastError = true)]
            public static extern bool FreeLibrary(IntPtr module);
            [DllImport("kernel32.dll", CharSet = CharSet.Unicode)]
            public static extern IntPtr GetModuleHandleW(string name);
          }
          '@
          foreach ($file in 'OpenSteamTool.dll', 'dwmapi.dll', 'xinput1_4.dll', 'ost-Injector.exe') {
            $path = (Resolve-Path "build/Release/$file").Path
            $imports = (& dumpbin /imports $path | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $file" }
            if ($imports -match '(?im)\b(ucrtbased|vcruntime\d+d|msvcp\d+d)\.dll\b') { throw "Debug CRT dependency in $file" }
          }
          $dll = (Resolve-Path 'build/Release/OpenSteamTool.dll').Path
          $bytes = [IO.File]::ReadAllBytes($dll)
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains($env:RELEASE_VERSION)) { throw 'Release identity missing' }
          if ($text.Contains('BIsDlcInstalled observation:')) { throw 'Debug observation logging was not removed' }
          $module = [ReleaseHostCheck]::LoadLibraryW($dll)
          if ($module -eq [IntPtr]::Zero) { throw "Load failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          Start-Sleep -Seconds 1
          if (Test-Path 'build/Release/opensteamtool') { throw 'Unexpected runtime initialization outside Steam' }
          if (-not [ReleaseHostCheck]::FreeLibrary($module)) { throw 'Unload failed' }
          if ([ReleaseHostCheck]::GetModuleHandleW($dll) -ne [IntPtr]::Zero) { throw 'Core was pinned outside Steam' }

      - name: Package runtime files and Chinese instructions
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'release-package'
          $assets = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Path "$stage/dave-launcher", $assets -Force | Out-Null
          foreach ($file in 'OpenSteamTool.dll','dwmapi.dll','xinput1_4.dll','ost-Injector.exe','CreateAutoInjectTask.bat','DeleteAutoInjectTask.bat') {
            Copy-Item -LiteralPath "build/Release/$file" -Destination $stage
          }
          foreach ($file in 'DaveLauncher.exe','DaveLauncher.json','SteamPlayGate.js') {
            Copy-Item -LiteralPath "build/Release/dave-launcher/$file" -Destination "$stage/dave-launcher"
          }
          Copy-Item tools/DaveLauncher/README.zh.md "$stage/dave-launcher/README.zh.md"
          Copy-Item "docs/releases/$env:RELEASE_VERSION.md" "$stage/README-Dave.zh.md"
          Copy-Item LICENSE, opensteamtool.example.toml $stage
          [ordered]@{
            version = $env:RELEASE_VERSION
            configuration = 'Release'
            commit = '${{ github.sha }}'
            sourceBranch = '${{ github.ref_name }}'
            upstreamBase = '322d1d871c956d162107665a352438ca9e4a2833'
            supportedGame = 1868140
          } | ConvertTo-Json | Set-Content "$stage/BUILD-INFO.json" -Encoding utf8
          Get-ChildItem $stage -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring($stage.Length + 1).Replace('\','/')
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $relative"
          } | Set-Content "$stage/FILES-SHA256SUMS.txt" -Encoding ascii
          $unwanted = Get-ChildItem $stage -Recurse -File | Where-Object { $_.Extension -in '.pdb','.ilk','.obj','.lib','.exp','.log' -or $_.Name -match 'Tests|config\.ini' }
          if ($unwanted) { throw 'Non-distributable files found in package' }
          $zipName = "OpenSteamTool-$env:RELEASE_VERSION-Release-x64.zip"
          7z a "$assets/$zipName" "$stage/*" -mx=7
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          "$((Get-FileHash -LiteralPath "$assets/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant())  $zipName" | Set-Content "$assets/SHA256SUMS.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSteamTool-${{ inputs.version }}-Release-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
